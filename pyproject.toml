[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpguard"
version = "0.1.0"
description = "A firewall for MCP-based AI agents — intercepts and evaluates tool calls against YAML policies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["mcp", "ai", "security", "firewall", "agents", "llm", "tool-calls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
fastmcp = ["fastmcp>=2.9"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
mcpguard = "mcpguard.cli:main"

[project.urls]
Homepage = "https://github.com/regstrtn/mcpguard"
Documentation = "https://github.com/regstrtn/mcpguard#readme"
Issues = "https://github.com/regstrtn/mcpguard/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
